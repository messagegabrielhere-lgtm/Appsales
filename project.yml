# XcodeGen spec. Run `xcodegen generate` in this folder to produce Kept.xcodeproj.
name: Kept

options:
  bundleIdPrefix: com.messagegabrielhere
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID (developer.apple.com > Membership details).
    DEVELOPMENT_TEAM: MAP974T827
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  Kept:
    type: application
    platform: iOS
    sources:
      - path: Kept
      - path: KeptWidget/KeptWidgetView.swift
    info:
      path: Kept/Info.plist
      properties:
        CFBundleDisplayName: Kept
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Kept/Kept.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.messagegabrielhere.kept
    dependencies:
      - target: KeptWidget
        embed: true
    settings:
      base:
        # Must match the bundle ID on the App Store Connect app record.
        PRODUCT_BUNDLE_IDENTIFIER: com.messagegabrielhere.kept
        PRODUCT_NAME: Kept
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - KeptTests

  KeptWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KeptWidget
      - path: Kept/Models
      - path: Kept/Logic
      - path: Kept/Store
      - path: Kept/Shared
      - path: Kept/Views/HabitPalette.swift
    info:
      path: KeptWidget/Info.plist
      properties:
        CFBundleDisplayName: Kept
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KeptWidget/KeptWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.messagegabrielhere.kept
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.messagegabrielhere.kept.widget
        PRODUCT_NAME: KeptWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  KeptTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeptTests
    dependencies:
      - target: Kept
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.messagegabrielhere.kept.tests
        GENERATE_INFOPLIST_FILE: YES
