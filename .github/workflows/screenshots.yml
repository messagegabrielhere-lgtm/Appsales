name: App Store screenshots

# Captures the app in the iOS Simulator, adds captions, and publishes the finished
# App Store screenshot sets as a downloadable artifact. No Mac needed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Capture and caption
        run: scripts/screenshots.sh
        env:
          CI: "1"

      - name: Upload screenshot sets
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: build/screenshots/marketing
          if-no-files-found: error

      - name: Publish to the screenshots branch
        run: |
          set -e
          STAGE="$RUNNER_TEMP/shots"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R build/screenshots/marketing "$STAGE/marketing"
          cp -R build/screenshots/iphone-6.5-inch "$STAGE/raw-iphone-6.5-inch"
          cp -R build/screenshots/ipad-13-inch "$STAGE/raw-ipad-13-inch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq .
          git clean -fdxq
          cp -R "$STAGE/." .
          printf 'App Store screenshots generated from %s by the "App Store screenshots" workflow.\n\nUpload marketing/iphone-6.5-inch to the iPhone 6.5" tab and marketing/ipad-13-inch to the iPad 13" tab, in file order.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -qm "Screenshots from $GITHUB_SHA"
          git push --force origin screenshots
