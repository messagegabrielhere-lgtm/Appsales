name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    name: Logic tests (Linux, fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run model and logic tests
        run: scripts/test_logic.sh

  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]|iPhone [2-9][0-9]" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kept.xcodeproj \
            -scheme Kept \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log \
            | (grep -E "error:|warning:|Test Case|Test Suite|Executed|\*\* (BUILD|TEST)" || true)

      - name: Archive for device and check bundle IDs
        # Mirrors scripts/release.sh. App Store Connect rejects an upload whose widget has the
        # app's own bundle ID, so make sure the widget's ID is the app's plus ".widget".
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Kept.xcodeproj \
            -scheme Kept \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kept.xcarchive" \
            APP_BUNDLE_ID=com.messagegabrielhere.kept \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log \
            | (grep -E "error:|\*\* ARCHIVE" || true)
          APP="$RUNNER_TEMP/Kept.xcarchive/Products/Applications/Kept.app"
          app_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          widget_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/PlugIns/KeptWidget.appex/Info.plist")
          echo "App: $app_id  Widget: $widget_id"
          [ "$app_id" = "com.messagegabrielhere.kept" ] || { echo "::error::App bundle ID is $app_id"; exit 1; }
          [ "$widget_id" = "$app_id.widget" ] || { echo "::error::Widget bundle ID is $widget_id"; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            archive.log
          if-no-files-found: ignore
