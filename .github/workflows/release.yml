name: Release to App Store Connect

# Archives a signed build and uploads it to App Store Connect. After it finishes, the build
# appears under TestFlight in App Store Connect within about 15 minutes, ready to attach to
# the version and submit for review. See docs/RELEASE.md for the secrets this needs.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown on the App Store. Leave empty to use MARKETING_VERSION from project.yml"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Not secret: the same values are in project.yml and scripts/release.sh.
      BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.messagegabrielhere.kept' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'MAP974T827' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set temporary paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/release.keychain-db" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Check required secrets
        run: |
          missing=""
          # The distribution certificate is optional: without it, Xcode signs with an
          # Apple cloud-managed certificate through the App Store Connect API key.
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            eval "value=\${$name:-}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/RELEASE.md."
            exit 1
          fi
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Choose signing
        run: |
          if [ -n "$DIST_CERT_P12_BASE64" ] && [ -n "$DIST_CERT_PASSWORD" ]; then
            echo "HAS_DIST_CERT=true" >> "$GITHUB_ENV"
            echo "Signing with the distribution certificate from repository secrets"
          else
            echo "HAS_DIST_CERT=false" >> "$GITHUB_ENV"
            echo "No certificate secrets; signing with an Apple cloud-managed certificate via the API key"
          fi
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install App Store Connect API key
        run: |
          # Accept the .p8 however it was pasted: as-is, base64-encoded, on one line,
          # with literal \n, with CRLF, or as the bare key body. The key is never printed.
          python3 - <<'PY'
          import base64, os, re, textwrap
          raw = os.environ["APP_STORE_CONNECT_API_KEY_P8"].strip().strip('"').strip("'")
          raw = raw.replace("\\n", "\n").replace("\r", "")
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("utf-8", "strict")
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass
          match = re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----(.*?)-----END [A-Z ]*PRIVATE KEY-----", raw, re.S)
          body = re.sub(r"\s+", "", match.group(1) if match else raw)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          with open(os.environ["API_KEY_PATH"], "w") as f:
              f.write(pem)
          PY
          chmod 600 "$API_KEY_PATH"
          if ! openssl pkey -in "$API_KEY_PATH" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 isn't a valid App Store Connect .p8 key. Paste the full contents of AuthKey_<KEYID>.p8 into the secret again (see docs/RELEASE.md)."
            exit 1
          fi
          echo "API key installed and valid"
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Install distribution certificate
        if: env.HAS_DIST_CERT == 'true'
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Resolve version and build number
        run: |
          # Same rules as scripts/release.sh: the version comes from project.yml unless given,
          # and the build number from the clock, so it always sorts after earlier uploads.
          version="${{ github.event.inputs.marketing_version }}"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
          fi
          [ -n "$version" ] || { echo "::error::No MARKETING_VERSION in project.yml"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "Releasing version $version"

      - name: Archive
        run: |
          # A signed archive needs a development profile, which needs a registered device
          # that a CI runner doesn't have. Without a stored certificate, archive unsigned
          # and let the export step sign for the App Store (as scripts/release.sh does).
          if [ "$HAS_DIST_CERT" = "true" ]; then
            SIGNING="CODE_SIGN_STYLE=Automatic"
          else
            SIGNING="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
          fi
          set -o pipefail
          xcodebuild archive \
            -project Kept.xcodeproj \
            -scheme Kept \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kept.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            APP_BUNDLE_ID="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            $SIGNING \
                      | tee archive.log \
            | (grep -E "error:|warning:|\*\* (ARCHIVE|BUILD)" || true)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Check purpose strings before uploading
        run: |
          # Apple rejects a build (ITMS-90683) whose code or entitlements touch a protected
          # API without its purpose string. HealthKit needs both Health keys even read-only.
          plist="$RUNNER_TEMP/Kept.xcarchive/Products/Applications/Kept.app/Info.plist"
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription \
                     NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1 \
              || { echo "::error::Info.plist is missing $key; not uploading"; exit 1; }
          done
          echo "Archived version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kept.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            | tee export.log \
            | (grep -E "error:|warning:|Upload|EXPORT" || true)
          echo "Uploaded $BUNDLE_ID version $VERSION build $BUILD"
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$API_KEY_PATH"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
