name: Unlisted release

# Signs the Unlisted app and uploads it to App Store Connect (TestFlight).
# Run it by pushing a tag like `unlisted-v1.0.0`, or by changing
# unlisted/RELEASE_VERSION on the unlisted branch. The version comes from the
# tag or that file, and the build number from the run number.
#
# Uses the same three repository secrets as Kept's release workflow
# (Settings > Secrets and variables > Actions), so one API key serves both apps:
#   APP_STORE_CONNECT_API_KEY_ID      App Store Connect API key ID
#   APP_STORE_CONNECT_API_ISSUER_ID   App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY_P8      the AuthKey_XXXX.p8 file, as-is or base64
# Each run creates a temporary distribution certificate and App Store profile
# with the key and revokes them afterwards; nothing to export from a Mac.
# Optional repository variables: APPLE_TEAM_ID (defaults to MAP974T827) and
# UNLISTED_BUNDLE_ID (defaults to com.messagegabrielhere.unlisted).
on:
  # Or start it by hand from the Actions tab.
  workflow_dispatch:
  push:
    tags:
      - 'unlisted-v*'
    # Or: change unlisted/RELEASE_VERSION on the unlisted branch.
    branches:
      - unlisted
    paths:
      - 'unlisted/RELEASE_VERSION'
      - '.github/workflows/unlisted-release.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: unlisted
    env:
      BUNDLE_ID: ${{ vars.UNLISTED_BUNDLE_ID || 'com.messagegabrielhere.unlisted' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'MAP974T827' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets (shared with Kept): APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8. See the comment at the top of this workflow."
            exit 1
          fi

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # Accept the key however it was pasted: the .p8 as-is, with lost or
          # extra line breaks, with spaces, as base64 of the file, or just the
          # key body. Rebuild a clean PEM. Never prints the key itself.
          python3 - "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].strip().replace("\\n", "\n")
          def body_of(text):
              m = re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----(.*?)-----END [A-Z ]*PRIVATE KEY-----", text, re.S)
              return re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1)) if m else None
          body = body_of(raw)
          how = "pasted .p8"
          if body is None:
              compact = re.sub(r"\s", "", raw)
              try:
                  decoded = base64.b64decode(compact + "=" * (-len(compact) % 4)).decode("utf-8", "ignore")
              except Exception:
                  decoded = ""
              body = body_of(decoded)
              how = "base64 of .p8"
              if body is None:
                  body = re.sub(r"[^A-Za-z0-9+/=]", "", compact)
                  how = "key body only"
          try:
              der = base64.b64decode(body + "=" * (-len(body) % 4))
          except Exception:
              der = b""
          print(f"::notice title=API key format::Read as {how}; {len(der)} key bytes (a valid Apple key is 138 or 150).")
          if not (100 <= len(der) <= 200 and der[:1] == b"\x30"):
              print("::error title=API key::APP_STORE_CONNECT_API_KEY_P8 doesn't look like an Apple .p8 key. Open the AuthKey_XXXX.p8 file in a text editor, copy everything from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----, and paste it into the secret again.")
              sys.exit(1)
          b64 = base64.b64encode(der).decode()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(b64[i:i+64] for i in range(0, len(b64), 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          PY
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # The API key makes a temporary Apple Distribution certificate and App
      # Store profile for this run; they're revoked at the end. App Store
      # profiles don't need registered devices.
      - name: Set up signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.9.0"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/venv/bin/python" AppStore/signing.py create "$RUNNER_TEMP/signing"
          SIGN_P12="$(grep '^SIGN_P12=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          SIGN_P12_PASSWORD="$(grep '^SIGN_P12_PASSWORD=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGN_P12" -P "$SIGN_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$SIGN_P12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Distribution" \
            || { echo "::error title=Signing::The distribution certificate didn't install."; exit 1; }

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#unlisted-v}"; else VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if ! xcodebuild archive \
              -project Unlisted.xcodeproj -scheme Unlisted -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Unlisted.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$SIGN_PROFILE_NAME" > archive.log 2>&1; then
            grep -E "error:" archive.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 60 archive.log
            exit 1
          fi

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cp AppStore/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          $PB -c "Set :signingStyle manual" "$RUNNER_TEMP/ExportOptions.plist"
          $PB -c "Add :signingCertificate string Apple Distribution" "$RUNNER_TEMP/ExportOptions.plist"
          $PB -c "Add :provisioningProfiles dict" "$RUNNER_TEMP/ExportOptions.plist"
          $PB -c "Add :provisioningProfiles:$BUNDLE_ID string $SIGN_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          if ! xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Unlisted.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1; then
            grep -E "error|Error" export.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 60 export.log
            exit 1
          fi
          echo "::notice title=Uploaded::Build $GITHUB_RUN_NUMBER of version $VERSION uploaded. It appears in TestFlight after Apple finishes processing (about 10-30 minutes)."

      - name: Revoke temporary signing and remove API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -x "$RUNNER_TEMP/venv/bin/python" ] && [ -f "$RUNNER_TEMP/AuthKey.p8" ]; then
            ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/venv/bin/python" AppStore/signing.py revoke || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
