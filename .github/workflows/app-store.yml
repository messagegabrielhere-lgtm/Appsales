name: Publish to App Store

# Fills in an App Store version from the repository: name, subtitle, categories, description,
# keywords, What's New, screenshots, build and App Review notes. With "submit" ticked it also
# submits the version for App Review. Upload the build first (scripts/release.sh on a Mac).
# Needs three repository secrets; see docs/RELEASE.md, "Publish from GitHub".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        default: "2.1.0"
      listing:
        description: "Listing file"
        required: true
        default: "docs/listing/v2.1.md"
      build:
        description: "Build number (blank = newest uploaded for this version)"
        required: false
        default: ""
      submit:
        description: "Submit for App Review when done"
        type: boolean
        default: false
      iap_only:
        description: "Only the in-app purchase (leave the version, e.g. while it's in review)"
        type: boolean
        default: false

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  publish:
    name: Publish listing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            eval "value=\${$name:-}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/RELEASE.md, Publish from GitHub."
            exit 1
          fi

      - name: Check listing lengths
        run: python3 scripts/check_listing.py "${{ inputs.listing }}"

      - name: Get screenshots
        uses: actions/checkout@v4
        with:
          ref: screenshots
          path: screenshots

      - name: Get the in-app purchase review screenshot
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: journeys
          path: journeys

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyjwt cryptography requests

      - name: Publish
        run: |
          args=(--version "${{ inputs.version }}" --listing "${{ inputs.listing }}" --screenshots screenshots/marketing)
          [ -n "${{ inputs.build }}" ] && args+=(--build "${{ inputs.build }}")
          [ "${{ inputs.submit }}" = "true" ] && args+=(--submit)
          [ "${{ inputs.iap_only }}" = "true" ] && args+=(--iap-only)
          shot=$(ls journeys/test5_FreeUserMeetsTheUnlock-*-unlock.png 2>/dev/null | head -1 || true)
          [ -n "$shot" ] && args+=(--iap-screenshot "$shot")
          # docs/listing/v2.3.es-MX.md and the like: other languages for the same version.
          base="${{ inputs.listing }}"; base="${base%.md}"
          for extra in "$base".*.md; do
            [ -e "$extra" ] || continue
            loc=$(basename "$extra" .md); loc=${loc##*.}
            args+=(--extra-listing "$loc=$extra")
          done
          python3 scripts/app_store_connect.py "${args[@]}"
