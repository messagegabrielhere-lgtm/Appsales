name: Unlisted
options:
  bundleIdPrefix: com.messagegabrielhere
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: MAP974T827
targets:
  Unlisted:
    type: application
    platform: iOS
    sources:
      - path: Unlisted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.messagegabrielhere.unlisted
        PRODUCT_NAME: Unlisted
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Unlisted
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  UnlistedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnlistedTests
    dependencies:
      - target: Unlisted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.messagegabrielhere.unlisted.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Unlisted:
    build:
      targets:
        Unlisted: all
        UnlistedTests: [test]
    test:
      targets:
        - UnlistedTests
